# Render 블루프린트: 서버, PostgreSQL, Redis를 한 번에 만든다.
# Render 대시보드 → New → Blueprint → 이 저장소를 고르면 된다. 키(sync: false)는 화면에서 넣는다.
services:
  - type: web
    name: equipment-api
    runtime: docker
    rootDir: server
    region: singapore
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: equipment-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: equipment-redis, property: connectionString }
      # 아직 마이그레이션이 없어 시범 운영 동안은 표를 자동으로 맞춘다
      - { key: DB_SYNC, value: 'true' }
      - { key: JWT_SECRET, generateValue: true }
      - { key: PUBLIC_URL, sync: false }
      - { key: ADMIN_PHONES, sync: false }
      - { key: SOLAPI_API_KEY, sync: false }
      - { key: SOLAPI_API_SECRET, sync: false }
      - { key: SMS_SENDER, sync: false }
      - { key: TOSS_CLIENT_KEY, sync: false }
      - { key: TOSS_SECRET_KEY, sync: false }
      - { key: FCM_PROJECT_ID, sync: false }
      - { key: FCM_CLIENT_EMAIL, sync: false }
      - { key: FCM_PRIVATE_KEY, sync: false }
      - { key: KAKAO_REST_KEY, sync: false }
  - type: keyvalue
    name: equipment-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  - name: equipment-db
    region: singapore
    plan: basic-256mb
