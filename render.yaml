# Render 블루프린트: 서버, PostgreSQL, Redis를 한 번에 만든다.
# Render 대시보드 → New → Blueprint → 이 저장소를 고르면 된다. 문자·결제·알림·지도 키는 나중에 서비스의 Environment 화면에서 넣는다.
# 시범 운영은 무료 요금제로 돌린다(서버는 15분 쉬면 잠들고, 무료 DB는 30일 뒤 만료). 실제 운영 때 유료로 바꾼다.
services:
  - type: web
    name: equipment-api
    runtime: docker
    rootDir: server
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: equipment-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: equipment-redis, property: connectionString }
      # 아직 마이그레이션이 없어 시범 운영 동안은 표를 자동으로 맞춘다
      - { key: DB_SYNC, value: 'true' }
      - { key: JWT_SECRET, generateValue: true }
      # 문자 키(SOLAPI)가 없는 동안 인증번호는 이 값으로 고정된다. 문자 키를 넣으면 자동으로 꺼진다.
      - { key: OTP_DEV_CODE, value: '123456' }
  - type: keyvalue
    name: equipment-redis
    region: singapore
    plan: free
    ipAllowList: []

databases:
  - name: equipment-db
    region: singapore
    plan: free
